<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      @keyframes bobber { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(3px) } }
      @keyframes wave1 { 0%,100%{ transform: translateX(0) } 50%{ transform: translateX(6px) } }
      @keyframes wave2 { 0%,100%{ transform: translateX(0) } 50%{ transform: translateX(-4px) } }
      @keyframes fishLabel { 0%,100%{ opacity:.7 } 50%{ opacity:1 } }
      .pixel { shape-rendering: crispEdges; }
      .lbl { font-family: 'JetBrains Mono',monospace; font-size: 8px; font-weight: 700; text-anchor: middle; }
      .title-lbl { font-family: 'JetBrains Mono',monospace; font-size: 10px; fill: #3d444d; text-anchor: middle; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="280" fill="#0d1117" class="pixel"/>

  <!-- ══════ WATER LAYERS ══════ -->
  <rect y="130" width="900" height="150" fill="#0a1929" class="pixel"/>
  <g>
    <!-- Wave top layer -->
    <path d="M0,130 Q50,122 100,130 Q150,138 200,130 Q250,122 300,130 Q350,138 400,130 Q450,122 500,130 Q550,138 600,130 Q650,122 700,130 Q750,138 800,130 Q850,122 900,130 L900,145 L0,145 Z" fill="#0f2740" opacity=".8">
      <animate attributeName="d" values="M0,130 Q50,122 100,130 Q150,138 200,130 Q250,122 300,130 Q350,138 400,130 Q450,122 500,130 Q550,138 600,130 Q650,122 700,130 Q750,138 800,130 Q850,122 900,130 L900,145 L0,145 Z;M0,130 Q50,138 100,130 Q150,122 200,130 Q250,138 300,130 Q350,122 400,130 Q450,138 500,130 Q550,122 600,130 Q650,138 700,130 Q750,122 800,130 Q850,138 900,130 L900,145 L0,145 Z;M0,130 Q50,122 100,130 Q150,138 200,130 Q250,122 300,130 Q350,138 400,130 Q450,122 500,130 Q550,138 600,130 Q650,122 700,130 Q750,138 800,130 Q850,122 900,130 L900,145 L0,145 Z" dur="4s" repeatCount="indefinite"/>
    </path>
    <rect y="145" width="900" height="8" fill="#112d47" class="pixel" opacity=".6"/>
    <rect y="153" width="900" height="127" fill="#0a1929" class="pixel"/>
  </g>

  <!-- Water shimmer lines -->
  <line x1="200" y1="165" x2="260" y2="165" stroke="#1a3a5c" stroke-width="1" opacity=".3">
    <animate attributeName="x1" values="200;210;200" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="185" x2="470" y2="185" stroke="#1a3a5c" stroke-width="1" opacity=".25">
    <animate attributeName="x1" values="400;390;400" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <line x1="600" y1="155" x2="650" y2="155" stroke="#1a3a5c" stroke-width="1" opacity=".3">
    <animate attributeName="x1" values="600;612;600" dur="2.8s" repeatCount="indefinite"/>
  </line>
  <line x1="100" y1="200" x2="150" y2="200" stroke="#1a3a5c" stroke-width="1" opacity=".2">
    <animate attributeName="x1" values="100;108;100" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="700" y1="210" x2="760" y2="210" stroke="#1a3a5c" stroke-width="1" opacity=".25">
    <animate attributeName="x1" values="700;695;700" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <!-- ══════ DOCK / PIER ══════ -->
  <!-- Pier platform -->
  <rect x="30" y="120" width="130" height="8" fill="#6B4F12" class="pixel"/>
  <rect x="30" y="118" width="130" height="4" fill="#8B6914" class="pixel"/>
  <!-- Pier legs -->
  <rect x="45" y="122" width="6" height="40" fill="#5a4210" class="pixel"/>
  <rect x="100" y="122" width="6" height="40" fill="#5a4210" class="pixel"/>
  <rect x="145" y="122" width="6" height="35" fill="#5a4210" class="pixel"/>

  <!-- ══════ FISHERMAN (pixel art) ══════ -->
  <g transform="translate(130, 0)">
    <!-- Hat -->
    <rect x="-2" y="82" width="16" height="4" fill="#ff7b72" class="pixel"/>
    <rect x="2" y="78" width="8" height="4" fill="#ff7b72" class="pixel"/>
    <!-- Head -->
    <rect x="2" y="86" width="8" height="8" fill="#FFB86C" class="pixel"/>
    <!-- Eye -->
    <rect x="8" y="89" width="2" height="2" fill="#0d1117" class="pixel"/>
    <!-- Body -->
    <rect x="2" y="94" width="8" height="12" fill="#58a6ff" class="pixel"/>
    <!-- Arm holding rod (right, extended) -->
    <rect x="10" y="96" width="8" height="4" fill="#FFB86C" class="pixel"/>
    <!-- Arm left (resting) -->
    <rect x="-2" y="98" width="4" height="4" fill="#FFB86C" class="pixel"/>
    <!-- Legs (dangling off pier) -->
    <rect x="2" y="106" width="4" height="12" fill="#3d444d" class="pixel"/>
    <rect x="6" y="106" width="4" height="10" fill="#3d444d" class="pixel"/>
    <!-- Shoes -->
    <rect x="1" y="116" width="5" height="3" fill="#2d333b" class="pixel"/>
    <rect x="6" y="114" width="5" height="3" fill="#2d333b" class="pixel"/>
  </g>

  <!-- ══════ FISHING ROD ══════ -->
  <line x1="148" y1="98" x2="230" y2="60" stroke="#8B6914" stroke-width="2"/>
  <line x1="228" y1="60" x2="235" y2="55" stroke="#8B6914" stroke-width="1.5"/>
  <!-- Fishing line -->
  <line x1="235" y1="55" x2="235" y2="125" stroke="#6e7681" stroke-width="1" opacity=".6"/>
  <!-- Bobber -->
  <g style="animation: bobber 2s ease-in-out infinite">
    <circle cx="235" cy="128" r="4" fill="#ff7b72" class="pixel"/>
    <rect x="234" y="122" width="2" height="6" fill="#e6edf3" class="pixel"/>
  </g>

  <!-- ══════ DATA FISH ══════ -->

  <!-- Fish 1: JSON (red, swimming right) -->
  <g opacity=".85">
    <animateMotion dur="12s" repeatCount="indefinite" path="M900,170 L-100,170"/>
    <!-- Fish body -->
    <polygon points="0,-6 18,-6 22,0 18,6 0,6 -4,0" fill="#ff7b72" class="pixel"/>
    <!-- Tail -->
    <polygon points="-4,-4 -10,-8 -10,8 -4,4" fill="#ff7b72" class="pixel"/>
    <!-- Eye -->
    <rect x="15" y="-3" width="3" height="3" fill="#0d1117" class="pixel"/>
    <!-- Label -->
    <text x="6" y="3" class="lbl" fill="#0d1117">JSON</text>
  </g>

  <!-- Fish 2: CSV (yellow, swimming left) -->
  <g opacity=".85" transform="scale(-1,1)">
    <animateMotion dur="15s" repeatCount="indefinite" begin="2s" path="M-900,195 L100,195"/>
    <polygon points="0,-5 16,-5 20,0 16,5 0,5 -4,0" fill="#d29922" class="pixel"/>
    <polygon points="-4,-3 -9,-7 -9,7 -4,3" fill="#d29922" class="pixel"/>
    <rect x="13" y="-2" width="3" height="3" fill="#0d1117" class="pixel"/>
    <text x="5" y="3" class="lbl" fill="#0d1117" transform="scale(-1,1)">CSV</text>
  </g>

  <!-- Fish 3: SQL (green, swimming right) -->
  <g opacity=".85">
    <animateMotion dur="10s" repeatCount="indefinite" begin="4s" path="M900,220 L-100,220"/>
    <polygon points="0,-7 20,-7 25,0 20,7 0,7 -5,0" fill="#3fb950" class="pixel"/>
    <polygon points="-5,-5 -12,-9 -12,9 -5,5" fill="#3fb950" class="pixel"/>
    <rect x="17" y="-3" width="3" height="3" fill="#0d1117" class="pixel"/>
    <text x="7" y="3" class="lbl" fill="#0d1117">SQL</text>
  </g>

  <!-- Fish 4: API (purple, swimming left) -->
  <g opacity=".8" transform="scale(-1,1)">
    <animateMotion dur="18s" repeatCount="indefinite" begin="1s" path="M-900,155 L100,155"/>
    <polygon points="0,-5 14,-5 18,0 14,5 0,5 -3,0" fill="#bc8cff" class="pixel"/>
    <polygon points="-3,-3 -8,-6 -8,6 -3,3" fill="#bc8cff" class="pixel"/>
    <rect x="12" y="-2" width="2" height="2" fill="#0d1117" class="pixel"/>
    <text x="4" y="2" class="lbl" fill="#0d1117" transform="scale(-1,1)">API</text>
  </g>

  <!-- Fish 5: LOG (cyan, swimming right, deep) -->
  <g opacity=".7">
    <animateMotion dur="20s" repeatCount="indefinite" begin="6s" path="M900,245 L-100,245"/>
    <polygon points="0,-4 12,-4 15,0 12,4 0,4 -3,0" fill="#79c0ff" class="pixel"/>
    <polygon points="-3,-2 -7,-5 -7,5 -3,2" fill="#79c0ff" class="pixel"/>
    <rect x="10" y="-2" width="2" height="2" fill="#0d1117" class="pixel"/>
    <text x="3" y="2" class="lbl" fill="#0d1117">LOG</text>
  </g>

  <!-- Fish 6: Parquet (orange, big, slow) -->
  <g opacity=".75">
    <animateMotion dur="25s" repeatCount="indefinite" begin="8s" path="M900,200 L-100,200"/>
    <polygon points="0,-8 24,-8 30,0 24,8 0,8 -6,0" fill="#ffa657" class="pixel"/>
    <polygon points="-6,-6 -14,-10 -14,10 -6,6" fill="#ffa657" class="pixel"/>
    <rect x="20" y="-4" width="4" height="4" fill="#0d1117" class="pixel"/>
    <text x="8" y="3" class="lbl" fill="#0d1117">PARQUET</text>
  </g>

  <!-- ══════ BUBBLES ══════ -->
  <circle cx="235" cy="135" r="2" fill="none" stroke="#1a3a5c" stroke-width="1" opacity="0">
    <animate attributeName="cy" values="135;110" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.4;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="238" cy="138" r="1.5" fill="none" stroke="#1a3a5c" stroke-width="1" opacity="0">
    <animate attributeName="cy" values="138;108" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.3;0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- ══════ STARS (sky) ══════ -->
  <circle cx="300" cy="30" r=".8" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.5;.1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="15" r=".6" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.4;.1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="25" r=".7" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.5;.1" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="45" r=".5" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.3;.1" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="50" r=".6" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.45;.1" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="60" r=".7" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.4;.1" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="70" r=".5" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.5;.1" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="80" r=".6" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.35;.1" dur="4.8s" repeatCount="indefinite"/></circle>

  <!-- ══════ LABEL ══════ -->
  <text x="650" y="268" class="title-lbl">// fishing for insights in the data lake</text>
</svg>
