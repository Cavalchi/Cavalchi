<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      @keyframes bobber { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(3px) } }
      .pixel { shape-rendering: crispEdges; }
      .lbl { font-family: 'JetBrains Mono',monospace; font-size: 9px; font-weight: 700; fill: #0d1117; text-anchor: middle; dominant-baseline: central; }
      .title-lbl { font-family: 'JetBrains Mono',monospace; font-size: 10px; fill: #3d444d; text-anchor: middle; letter-spacing: 3px; }
      .etl-lbl { font-family: 'JetBrains Mono',monospace; font-size: 9px; font-weight: 700; fill: #3fb950; text-anchor: middle; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="280" fill="#0d1117" class="pixel"/>

  <!-- ══════ WATER ══════ -->
  <rect y="130" width="900" height="150" fill="#0a1929" class="pixel"/>
  <path d="M0,130 Q50,122 100,130 Q150,138 200,130 Q250,122 300,130 Q350,138 400,130 Q450,122 500,130 Q550,138 600,130 Q650,122 700,130 Q750,138 800,130 Q850,122 900,130 L900,145 L0,145 Z" fill="#0f2740" opacity=".8">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="M0,130 Q50,122 100,130 Q150,138 200,130 Q250,122 300,130 Q350,138 400,130 Q450,122 500,130 Q550,138 600,130 Q650,122 700,130 Q750,138 800,130 Q850,122 900,130 L900,145 L0,145 Z;M0,130 Q50,138 100,130 Q150,122 200,130 Q250,138 300,130 Q350,122 400,130 Q450,138 500,130 Q550,122 600,130 Q650,138 700,130 Q750,122 800,130 Q850,138 900,130 L900,145 L0,145 Z;M0,130 Q50,122 100,130 Q150,138 200,130 Q250,122 300,130 Q350,138 400,130 Q450,122 500,130 Q550,138 600,130 Q650,122 700,130 Q750,138 800,130 Q850,122 900,130 L900,145 L0,145 Z"/>
  </path>
  <rect y="145" width="900" height="8" fill="#112d47" class="pixel" opacity=".6"/>

  <!-- Water shimmer -->
  <line x1="200" y1="165" x2="260" y2="165" stroke="#1a3a5c" stroke-width="1" opacity=".3"><animate attributeName="x1" values="200;210;200" dur="3s" repeatCount="indefinite"/></line>
  <line x1="400" y1="190" x2="470" y2="190" stroke="#1a3a5c" stroke-width="1" opacity=".25"><animate attributeName="x1" values="400;390;400" dur="3.5s" repeatCount="indefinite"/></line>
  <line x1="600" y1="160" x2="650" y2="160" stroke="#1a3a5c" stroke-width="1" opacity=".3"><animate attributeName="x1" values="600;612;600" dur="2.8s" repeatCount="indefinite"/></line>
  <line x1="700" y1="210" x2="760" y2="210" stroke="#1a3a5c" stroke-width="1" opacity=".25"><animate attributeName="x1" values="700;695;700" dur="3.2s" repeatCount="indefinite"/></line>

  <!-- ══════ DOCK ══════ -->
  <rect x="30" y="120" width="140" height="8" fill="#6B4F12" class="pixel"/>
  <rect x="30" y="118" width="140" height="4" fill="#8B6914" class="pixel"/>
  <rect x="50" y="122" width="6" height="40" fill="#5a4210" class="pixel"/>
  <rect x="105" y="122" width="6" height="40" fill="#5a4210" class="pixel"/>
  <rect x="155" y="122" width="6" height="35" fill="#5a4210" class="pixel"/>

  <!-- ══════ ETL BASKET ══════ -->
  <g transform="translate(52, 98)">
    <!-- Basket body -->
    <rect x="0" y="4" width="32" height="18" rx="2" fill="#5a4210" class="pixel"/>
    <rect x="2" y="6" width="28" height="14" rx="1" fill="#6B4F12" class="pixel"/>
    <!-- Basket handle -->
    <rect x="12" y="0" width="8" height="4" fill="#5a4210" class="pixel"/>
    <!-- Label -->
    <text x="16" y="15" class="etl-lbl">ETL</text>
    <!-- Weave lines -->
    <line x1="4" y1="10" x2="28" y2="10" stroke="#5a4210" stroke-width=".5" opacity=".6"/>
    <line x1="4" y1="15" x2="28" y2="15" stroke="#5a4210" stroke-width=".5" opacity=".6"/>
  </g>

  <!-- ══════ FISHERMAN ══════ -->
  <g transform="translate(138, 0)">
    <!-- Hat -->
    <rect x="-2" y="82" width="16" height="4" fill="#ff7b72" class="pixel"/>
    <rect x="2" y="78" width="8" height="4" fill="#ff7b72" class="pixel"/>
    <!-- Head -->
    <rect x="2" y="86" width="8" height="8" fill="#FFB86C" class="pixel"/>
    <rect x="8" y="89" width="2" height="2" fill="#0d1117" class="pixel"/>
    <!-- Body -->
    <rect x="2" y="94" width="8" height="12" fill="#58a6ff" class="pixel"/>
    <!-- Arm right (holding rod) -->
    <rect x="10" y="96" width="8" height="4" fill="#FFB86C" class="pixel"/>
    <!-- Arm left -->
    <rect x="-2" y="98" width="4" height="4" fill="#FFB86C" class="pixel"/>
    <!-- Legs -->
    <rect x="2" y="106" width="4" height="12" fill="#3d444d" class="pixel"/>
    <rect x="6" y="106" width="4" height="10" fill="#3d444d" class="pixel"/>
    <!-- Shoes -->
    <rect x="1" y="116" width="5" height="3" fill="#2d333b" class="pixel"/>
    <rect x="6" y="114" width="5" height="3" fill="#2d333b" class="pixel"/>
  </g>

  <!-- ══════ FISHING ROD ══════ -->
  <line x1="156" y1="98" x2="240" y2="58" stroke="#8B6914" stroke-width="2"/>
  <line x1="238" y1="58" x2="245" y2="53" stroke="#8B6914" stroke-width="1.5"/>
  <line x1="245" y1="53" x2="245" y2="125" stroke="#6e7681" stroke-width="1" opacity=".6"/>
  <!-- Bobber -->
  <g style="animation: bobber 2s ease-in-out infinite">
    <circle cx="245" cy="128" r="4" fill="#ff7b72"/>
    <rect x="244" y="122" width="2" height="6" fill="#e6edf3"/>
  </g>

  <!-- ══════ FISH SWIMMING (all correct orientation) ══════ -->

  <!-- Fish 1: JSON — swimming LEFT (facing left, nose on left) -->
  <g opacity=".85">
    <animateMotion dur="14s" repeatCount="indefinite" path="M960,170 L-80,170"/>
    <polygon points="0,0 5,-9 45,-9 45,9 5,9" fill="#ff7b72" class="pixel"/>
    <polygon points="45,-6 55,-12 55,12 45,6" fill="#ff7b72" class="pixel"/>
    <circle cx="10" cy="-3" r="2.5" fill="#0d1117"/>
    <text x="27" y="1" class="lbl">JSON</text>
  </g>

  <!-- Fish 2: CSV — swimming LEFT -->
  <g opacity=".85">
    <animateMotion dur="18s" repeatCount="indefinite" begin="3s" path="M960,200 L-80,200"/>
    <polygon points="0,0 5,-8 40,-8 40,8 5,8" fill="#d29922" class="pixel"/>
    <polygon points="40,-5 50,-10 50,10 40,5" fill="#d29922" class="pixel"/>
    <circle cx="10" cy="-2" r="2" fill="#0d1117"/>
    <text x="24" y="1" class="lbl">CSV</text>
  </g>

  <!-- Fish 3: SQL — swimming RIGHT (facing right, nose on right) -->
  <g opacity=".85">
    <animateMotion dur="12s" repeatCount="indefinite" begin="1s" path="M-80,185 L960,185"/>
    <polygon points="45,0 40,-9 0,-9 0,9 40,9" fill="#3fb950" class="pixel"/>
    <polygon points="0,-6 -10,-12 -10,12 0,6" fill="#3fb950" class="pixel"/>
    <circle cx="35" cy="-3" r="2.5" fill="#0d1117"/>
    <text x="20" y="1" class="lbl">SQL</text>
  </g>

  <!-- Fish 4: API — swimming RIGHT -->
  <g opacity=".8">
    <animateMotion dur="16s" repeatCount="indefinite" begin="5s" path="M-80,155 L960,155"/>
    <polygon points="40,0 35,-8 0,-8 0,8 35,8" fill="#bc8cff" class="pixel"/>
    <polygon points="0,-5 -8,-10 -8,10 0,5" fill="#bc8cff" class="pixel"/>
    <circle cx="30" cy="-2" r="2" fill="#0d1117"/>
    <text x="18" y="1" class="lbl">API</text>
  </g>

  <!-- Fish 5: PARQUET — swimming LEFT (big, slow) -->
  <g opacity=".75">
    <animateMotion dur="24s" repeatCount="indefinite" begin="7s" path="M960,230 L-100,230"/>
    <polygon points="0,0 6,-12 60,-12 60,12 6,12" fill="#ffa657" class="pixel"/>
    <polygon points="60,-8 72,-16 72,16 60,8" fill="#ffa657" class="pixel"/>
    <circle cx="12" cy="-5" r="3" fill="#0d1117"/>
    <text x="35" y="2" class="lbl" font-size="8">PARQUET</text>
  </g>

  <!-- Fish 6: LOG — swimming LEFT -->
  <g opacity=".7">
    <animateMotion dur="20s" repeatCount="indefinite" begin="10s" path="M960,250 L-80,250"/>
    <polygon points="0,0 4,-7 35,-7 35,7 4,7" fill="#79c0ff" class="pixel"/>
    <polygon points="35,-4 43,-9 43,9 35,4" fill="#79c0ff" class="pixel"/>
    <circle cx="8" cy="-2" r="2" fill="#0d1117"/>
    <text x="20" y="1" class="lbl">LOG</text>
  </g>

  <!-- ══════ CAUGHT FISH (animated from water to basket) ══════ -->
  <!-- Fish gets caught at bobber, rises up the line, arcs to basket -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;1;1;0.5;0" keyTimes="0;0.1;0.15;0.2;0.4;0.6;0.8;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animateMotion dur="8s" repeatCount="indefinite" path="M245,140 L245,130 C245,100 245,80 230,70 C210,60 120,80 75,105"/>
    <!-- Small caught fish -->
    <polygon points="0,0 4,-6 28,-6 28,6 4,6" fill="#3fb950" class="pixel"/>
    <polygon points="28,-4 35,-8 35,8 28,4" fill="#3fb950" class="pixel"/>
    <circle cx="8" cy="-2" r="1.5" fill="#0d1117"/>
    <text x="17" y="1" class="lbl" font-size="7">RAW</text>
  </g>

  <!-- Second caught fish (staggered) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;1;1;0.5;0" keyTimes="0;0.1;0.15;0.2;0.4;0.6;0.8;0.9;1" dur="8s" begin="4s" repeatCount="indefinite"/>
    <animateMotion dur="8s" begin="4s" repeatCount="indefinite" path="M245,140 L245,130 C245,100 245,80 230,70 C210,60 120,80 75,105"/>
    <polygon points="0,0 4,-6 28,-6 28,6 4,6" fill="#d29922" class="pixel"/>
    <polygon points="28,-4 35,-8 35,8 28,4" fill="#d29922" class="pixel"/>
    <circle cx="8" cy="-2" r="1.5" fill="#0d1117"/>
    <text x="17" y="1" class="lbl" font-size="7">CSV</text>
  </g>

  <!-- ══════ BUBBLES ══════ -->
  <circle cx="245" cy="135" r="2" fill="none" stroke="#1a3a5c" stroke-width="1" opacity="0">
    <animate attributeName="cy" values="135;110" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.4;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="248" cy="138" r="1.5" fill="none" stroke="#1a3a5c" stroke-width="1" opacity="0">
    <animate attributeName="cy" values="138;108" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.3;0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- ══════ STARS ══════ -->
  <circle cx="300" cy="30" r=".8" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.5;.1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="15" r=".6" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.4;.1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="25" r=".7" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.5;.1" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="45" r=".5" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.3;.1" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="50" r=".6" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.45;.1" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="60" r=".7" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.4;.1" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="70" r=".5" fill="#fff" opacity=".2"><animate attributeName="opacity" values=".1;.5;.1" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="80" r=".6" fill="#fff" opacity=".15"><animate attributeName="opacity" values=".1;.35;.1" dur="4.8s" repeatCount="indefinite"/></circle>

  <!-- ══════ LABEL ══════ -->
  <text x="650" y="268" class="title-lbl">// fishing for insights in the data lake</text>
</svg>
